<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>داشبورد المسوّقين بالمبلغ المقطوع — محاسن UGC</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#1c2430;--mut:#7a8699;--brand:#1F4E5F;--brand2:#2b6b80;--line:#e6eaf0;--chip:#eef3f6;--ok:#167d52;--warn:#b9770a;--pink:#b5366b}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI","Tahoma",sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header{background:linear-gradient(120deg,var(--brand),var(--brand2));color:#fff;padding:18px 22px}
header h1{margin:0 0 4px;font-size:20px}
header .sub{opacity:.9;font-size:13px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.stat{background:rgba(255,255,255,.14);border-radius:10px;padding:8px 14px;min-width:92px}
.stat b{display:block;font-size:19px}
.stat span{font-size:11px;opacity:.9}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
.bar{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;position:sticky;top:8px;z-index:5;box-shadow:0 2px 10px rgba(20,30,50,.04)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row+.row{margin-top:10px}
input[type=text],input[type=number],select{border:1px solid var(--line);border-radius:9px;padding:8px 11px;font:inherit;background:#fbfcfe}
#q{flex:1;min-width:200px}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:20px;padding:6px 13px;cursor:pointer;font-size:12.5px;user-select:none;white-space:nowrap}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.lbl-mut{color:var(--mut);font-size:12px;margin-inline-end:4px}
.count{color:var(--mut);font-size:13px;margin:6px 2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 6px rgba(20,30,50,.03)}
.chead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start}
.nm{font-weight:700;font-size:15px}
.ph{direction:ltr;color:var(--mut);font-size:12.5px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.b{border-radius:7px;padding:3px 9px;font-size:11.5px;font-weight:600}
.b.cat{background:#e7f1f5;color:var(--brand)}
.b.lab{background:#f0ecf7;color:#5b3fa0}
.b.child{background:#fde8f0;color:var(--pink)}
.b.code{background:#eaf6ee;color:var(--ok)}
.b.nocode{background:#f3f4f6;color:var(--mut)}
.b.await{background:#fff3e0;color:var(--warn)}
.meta{color:var(--mut);font-size:12px;margin-top:4px}
.pricebox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.pricebox label{font-size:12px;color:var(--mut)}
.pricebox input[type=number]{width:95px}
.pricebox input.note{flex:1;min-width:140px}
.auto{font-size:11px;color:var(--mut)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 12px;cursor:pointer;font:inherit;font-size:12.5px}
.btn:hover{background:#f6f8fa}
.wa{background:#25d366;color:#fff;border-color:#25d366;text-decoration:none}
.sec{margin-top:10px;display:none}
.sec.open{display:block}
.content-item{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid #f1f3f6;font-size:12.5px}
.content-item a{color:var(--brand2);word-break:break-all}
.pf{background:var(--chip);border-radius:6px;padding:2px 7px;font-size:11px;color:var(--mut)}
.dirIn{color:var(--ok);font-weight:700;font-size:11px}
.dirOut{color:var(--mut);font-size:11px}
.ev{background:#fafbfc;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;margin-top:6px}
.ev b{color:var(--brand)}
.gate{max-width:360px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px;text-align:center}
.gate input{width:100%;margin:12px 0;text-align:center;font-size:18px;letter-spacing:4px}
.gate button{width:100%;background:var(--brand);color:#fff;border:none;border-radius:10px;padding:11px;font-size:15px;cursor:pointer}
.synced{font-size:11px;color:var(--ok)}
.bulk{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
@media(max-width:600px){.pricebox input.note{min-width:100px}}
</style>
</head>
<body>
<div id="gate" class="gate" style="display:none">
  <h2 style="margin:0;color:var(--brand)">🔒 داشبورد UGC</h2>
  <p style="color:var(--mut);font-size:13px">للموظف المختص بالمبلغ المقطوع</p>
  <input id="pin" type="password" placeholder="الرقم السري" maxlength="12">
  <button id="unlock">دخول</button>
</div>

<div id="app" style="display:block">
<header>
  <h1>داشبورد المسوّقين بالمبلغ المقطوع</h1>
  <div class="sub">UGC — تحليل المحتوى والأسعار والأكواد • محاسن</div>
  <div class="stats" id="stats"></div>
</header>
<div class="wrap">
  <div class="bar">
    <div class="row">
      <input id="q" type="text" placeholder="🔎 بحث بالاسم أو الرقم أو الكود…">
      <select id="sort">
        <option value="last">الأحدث تواصلاً</option>
        <option value="price_desc">السعر: الأعلى</option>
        <option value="price_asc">السعر: الأقل</option>
        <option value="count">الأكثر رسائل</option>
      </select>
    </div>
    <div class="row">
      <span class="lbl-mut">المحتوى:</span>
      <span class="chip" data-cat="before_after">قبل وبعد</span>
      <span class="chip" data-cat="show_hair">يظهرون شعرهم</span>
      <span class="chip" data-cat="bottle_only">العبوة/تجربة</span>
      <span class="chip" data-cat="voice">فويس/صوت</span>
      <span class="chip" data-cat="kids">أطفال</span>
    </div>
    <div class="row">
      <span class="lbl-mut">السعر:</span>
      <input id="pmin" type="number" placeholder="من" style="width:80px">
      <input id="pmax" type="number" placeholder="إلى" style="width:80px">
      <span class="lbl-mut">الكود:</span>
      <span class="chip" data-flag="code">له كود سابق</span>
      <span class="chip" data-flag="nocode">بدون كود</span>
      <span class="chip" data-flag="await">بانتظار التحويل</span>
      <span class="chip" data-flag="child">حملة أطفال</span>
      <span class="chip" data-flag="multi">مشترك بأكثر من تصنيف</span>
    </div>
    <div class="row bulk">
      <button class="btn" id="clearf">مسح الفلاتر</button>
      <button class="btn" id="export">⬇ تصدير الأسعار/الملاحظات (CSV)</button>
      <span id="syncstate" class="auto"></span>
    </div>
  </div>
  <div class="count" id="count"></div>
  <div id="list"></div>
</div>
</div>

var CATLABEL={before_after:"قبل وبعد",show_hair:"يظهرون شعرهم",bottle_only:"العبوة/تجربة شخصية",voice:"فويس/تعليق صوتي",kids:"أطفال"};
var PLATEMOJI={"تيك توك":"🎵","انستقرام":"📸","يوتيوب":"▶️","سناب":"👻","تويتر":"🐦","المتجر":"🛒","رابط":"🔗"};
var state={cats:[],flags:[],q:"",pmin:null,pmax:null,sort:"last"};
var edits={}; // phone -> {price,note}
function $(id){return document.getElementById(id);}
function digits(s){return (s||"").replace(/\D/g,"");}
function esc(s){return (s||"").replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

// localStorage edits
function loadLocal(){try{edits=JSON.parse(localStorage.getItem("ugc_edits")||"{}");}catch(e){edits={};}}
function saveLocal(){try{localStorage.setItem("ugc_edits",JSON.stringify(edits));}catch(e){}}

function effPrice(r){var e=edits[digits(r.phone)];if(e&&e.price!=null&&e.price!=="")return e.price;return r.agreed;}
function effNote(r){var e=edits[digits(r.phone)];return e&&e.note?e.note:"";}

function buildSearch(r){
  return (r.name+" "+r.phone+" "+(r.code||"")+" "+(r.target_labels||[]).join(" ")).toLowerCase();
}
DATA.forEach(function(r){r._s=buildSearch(r);});

function stats(){
  var n=DATA.length;
  var cc={before_after:0,show_hair:0,bottle_only:0,voice:0,kids:0};
  var np=0,ncode=0,naw=0;
  DATA.forEach(function(r){for(var k in r.cats)if(cc[k]!=null)cc[k]++;if(effPrice(r))np++;if(r.has_prior_code)ncode++;if(r.awaiting_transfer)naw++;});
  var h="";
  h+='<div class="stat"><b>'+n+'</b><span>مسوّقة</span></div>';
  h+='<div class="stat"><b>'+np+'</b><span>لهم سعر</span></div>';
  h+='<div class="stat"><b>'+ncode+'</b><span>كود سابق</span></div>';
  h+='<div class="stat"><b>'+naw+'</b><span>بانتظار التحويل</span></div>';
  h+='<div class="stat"><b>'+cc.before_after+'</b><span>قبل وبعد</span></div>';
  h+='<div class="stat"><b>'+cc.show_hair+'</b><span>شعرهم</span></div>';
  h+='<div class="stat"><b>'+cc.kids+'</b><span>أطفال</span></div>';
  h+='<div class="stat"><b>'+cc.voice+'</b><span>فويس</span></div>';
  $("stats").innerHTML=h;
}

function match(r){
  if(state.q&&r._s.indexOf(state.q)===-1)return false;
  for(var i=0;i<state.cats.length;i++){if(!r.cats[state.cats[i]])return false;}
  var p=effPrice(r);
  if(state.pmin!=null&&(!p||p<state.pmin))return false;
  if(state.pmax!=null&&(!p||p>state.pmax))return false;
  if(state.flags.indexOf("code")>=0&&!r.has_prior_code)return false;
  if(state.flags.indexOf("nocode")>=0&&r.has_prior_code)return false;
  if(state.flags.indexOf("await")>=0&&!r.awaiting_transfer)return false;
  if(state.flags.indexOf("child")>=0&&!r.is_child)return false;
  if(state.flags.indexOf("multi")>=0&&(r.target_labels||[]).length<2)return false;
  return true;
}
function sortRows(rows){
  var s=state.sort;
  rows.sort(function(a,b){
    if(s==="price_desc")return (effPrice(b)||0)-(effPrice(a)||0);
    if(s==="price_asc")return (effPrice(a)||1e9)-(effPrice(b)||1e9);
    if(s==="count")return (b.count||0)-(a.count||0);
    return (b.last||"").localeCompare(a.last||"");
  });
  return rows;
}

function card(r,idx){
  var cats=Object.keys(r.cats).map(function(k){return '<span class="b cat">'+CATLABEL[k]+'</span>';}).join("");
  var labs=(r.target_labels||[]).map(function(L){return '<span class="b lab">'+esc(L)+'</span>';}).join("");
  var child=r.is_child?'<span class="b child">👶 أطفال</span>':"";
  var codeb=r.has_prior_code?('<span class="b code">كود: '+esc(r.code||"نعم")+'</span>'):'<span class="b nocode">بدون كود</span>';
  var awb=r.awaiting_transfer?'<span class="b await">⏳ بانتظار التحويل</span>':"";
  var multi=(r.target_labels||[]).length>1?'<span class="b" style="background:#fff7e6;color:#9a6b00">مشترك '+r.target_labels.length+' تصنيفات</span>':"";
  var price=effPrice(r);
  var bundstr=(r.bundles&&r.bundles.length)?('<div class="meta">📦 باقات: '+r.bundles.map(function(b){return (b.qty===2?"مقطعين":b.qty+" مقاطع")+" بـ"+b.amount+" ر";}).join("، ")+'</div>'):"";
  var offers=r.offers&&r.offers.length?("عروض: "+r.offers.join(", ")+" ر"):"";
  var transf=r.transfers&&r.transfers.length?(" • حوالات: "+r.transfers.join(", ")+" ر"):"";
  var claim=r.client_claims&&r.client_claims.length?(' • <span style="color:#b5366b">ذكرت العميلة: '+r.client_claims.join(", ")+" ر</span>"):"";
  var iban=r.info&&r.info.iban?('<div class="meta">IBAN: <span style="direction:ltr">'+esc(r.info.iban)+'</span></div>'):"";
  var wa=r.phone?('<a class="btn wa" href="https://wa.me/'+digits(r.phone)+'" target="_blank">واتساب 💬</a>'):"";
  var h='<div class="card" id="c'+idx+'">';
  h+='<div class="chead"><div><div class="nm">'+esc(r.name||r.phone)+'</div><div class="ph">'+esc(r.phone)+'</div></div>';
  var rev=r.price_review?' <span class="b" style="background:#fff0f0;color:#b5366b">⚠ راجع السجل</span>':"";
  var conf=r.agreed?('<div class="auto">'+(edits[digits(r.phone)]&&edits[digits(r.phone)].price?"معدّل يدوي":("تلقائي • "+(r.price_conf||"")))+'</div>'):"";
  h+='<div style="text-align:left"><div class="nm" style="color:var(--brand)">'+(price?price+" ر.س <span class=\"auto\">/ للمقطع</span>":'<span style="color:#b9770a">— غير محدد</span>')+'</div>'+conf+'</div></div>';
  h+='<div class="badges">'+cats+" "+codeb+" "+awb+" "+multi+rev+'</div>';
  h+='<div class="badges">'+labs+child+'</div>';
  h+='<div class="meta">'+(offers||"")+transf+claim+' • '+(r.count||0)+' رسالة • '+esc(r.first)+' ← '+esc(r.last)+'</div>';
  h+=iban;
  h+=bundstr;
  // price editor
  h+='<div class="pricebox"><label>السعر المتفق:</label><input type="number" value="'+(price!=null?price:"")+'" data-ph="'+esc(r.phone)+'" class="pin-price" placeholder="—">';
  h+='<input type="text" class="note pin-note" data-ph="'+esc(r.phone)+'" value="'+esc(effNote(r))+'" placeholder="ملاحظة (نوع الاتفاق/التحديث)"><button class="btn save-one" data-ph="'+esc(r.phone)+'">حفظ</button></div>';
  // actions
  h+='<div class="actions">'+wa+'<button class="btn" onclick="toggle(\'ph'+idx+'\')">سجل الأسعار ('+((r.price_history||[]).length)+')</button><button class="btn" onclick="toggle(\'ev'+idx+'\')">الأدلة من الشات</button><button class="btn" onclick="toggle(\'ct'+idx+'\')">قائمة المحتوى ('+(r.content?r.content.length:0)+')</button></div>';
  // price history
  var ph="";
  (r.price_history||[]).forEach(function(x){
    var lab=x.qty>1?(x.qty===2?"مقطعين":x.qty+" مقاطع"):"مقطع واحد";
    var col=x.qty>1?"#b5366b":"var(--brand)";
    ph+='<div class="content-item"><b style="color:'+col+'">'+lab+': '+x.amount+' ر</b><span class="auto">'+esc(x.t)+'</span><span style="flex:1"></span><span class="auto">«'+esc(x.snip.slice(0,52))+'»</span></div>';
  });
  h+='<div class="sec" id="ph'+idx+'">'+(ph||'<div class="meta">لا توجد أسعار صريحة بالشات — عبّي يدوي</div>')+'</div>';
  // evidence
  var ev="";
  for(var k in r.cats){if(r.cats[k])ev+='<div><b>'+CATLABEL[k]+':</b> «'+esc(r.cats[k])+'»</div>';}
  if(r.code_src)ev+='<div><b>الكود:</b> «'+esc(r.code_src)+'»</div>';
  h+='<div class="sec ev" id="ev'+idx+'">'+(ev||"لا توجد أدلة نصية واضحة")+'</div>';
  // content list
  var ct="";
  (r.content||[]).forEach(function(x){
    var types=(x.type||[]).map(function(t){return CATLABEL[t];}).join("، ");
    ct+='<div class="content-item"><span class="'+(x.dir==="in"?"dirIn":"dirOut")+'">'+(x.dir==="in"?"منها":"منّا")+'</span><span class="pf">'+(PLATEMOJI[x.platform]||"🔗")+" "+x.platform+'</span><a href="'+esc(x.link)+'" target="_blank">'+esc(x.link.slice(0,70))+'</a><span class="auto">'+esc(x.t)+(types?" • "+types:"")+'</span></div>';
  });
  h+='<div class="sec" id="ct'+idx+'">'+(ct||'<div class="meta">لا توجد روابط محتوى</div>')+'</div>';
  h+='</div>';
  return h;
}
window.toggle=function(id){$(id).classList.toggle("open");};

function render(){
  var rows=DATA.filter(match);
  sortRows(rows);
  $("count").textContent=rows.length+" مسوّقة"+(rows.length!==DATA.length?(" من "+DATA.length):"");
  var html="";
  for(var i=0;i<rows.length;i++)html+=card(rows[i],DATA.indexOf(rows[i]));
  $("list").innerHTML=html||'<div class="card">لا توجد نتائج مطابقة</div>';
  bindEditors();
}
function bindEditors(){
  document.querySelectorAll(".save-one").forEach(function(b){
    b.onclick=function(){
      var ph=b.getAttribute("data-ph");
      var pr=document.querySelector('.pin-price[data-ph="'+CSS.escape(ph)+'"]').value;
      var nt=document.querySelector('.pin-note[data-ph="'+CSS.escape(ph)+'"]').value;
      var dk=digits(ph);edits[dk]={price:pr===""?null:Number(pr),note:nt};
      saveLocal();pushSheet(dk,edits[dk]);
      b.textContent="✓ تم";setTimeout(function(){b.textContent="حفظ";},1200);
      stats();
    };
  });
}

// ===== Google Sheet sync =====
function pushSheet(ph,e){
  if(!APPS_SCRIPT_URL)return;
  try{
    fetch(APPS_SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},
      body:JSON.stringify({pin:ADMIN_PIN,phone:ph,price:e.price,note:e.note})});
    $("syncstate").innerHTML='<span class="synced">✓ تم الحفظ بالجدول</span>';
  }catch(err){}
}
function pullSheet(){
  if(!SHEET_CSV_URL)return;
  fetch(SHEET_CSV_URL).then(function(r){return r.text();}).then(function(t){
    var lines=t.split(/\r?\n/);
    for(var i=1;i<lines.length;i++){
      var c=lines[i].split(",");
      if(c.length<2)continue;
      var ph=c[0].replace(/[^0-9]/g,"").trim();
      if(!ph)continue;
      edits[ph]={price:c[1]?Number(c[1]):null,note:(c[2]||"").replace(/"/g,"")};
    }
    saveLocal();stats();render();
    $("syncstate").innerHTML='<span class="synced">✓ تمت المزامنة من الجدول</span>';
  }).catch(function(){});
}

function exportCSV(){
  var out="phone,price,note\n";
  DATA.forEach(function(r){
    var p=effPrice(r),n=effNote(r);
    if(p!=null||n)out+='"'+r.phone+'",'+(p!=null?p:"")+',"'+(n||"").replace(/"/g,'""')+'"\n';
  });
  var bl=new Blob([out],{type:"text/csv;charset=utf-8"});
  var a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download="اسعار-UGC.csv";a.click();
}

// events
document.querySelectorAll(".chip[data-cat]").forEach(function(c){c.onclick=function(){var k=c.getAttribute("data-cat");var i=state.cats.indexOf(k);if(i>=0)state.cats.splice(i,1);else state.cats.push(k);c.classList.toggle("on");render();};});
document.querySelectorAll(".chip[data-flag]").forEach(function(c){c.onclick=function(){var k=c.getAttribute("data-flag");var i=state.flags.indexOf(k);if(i>=0)state.flags.splice(i,1);else state.flags.push(k);c.classList.toggle("on");render();};});
$("q").addEventListener("input",function(e){state.q=e.target.value.trim().toLowerCase();render();});
$("pmin").addEventListener("input",function(e){state.pmin=e.target.value?Number(e.target.value):null;render();});
$("pmax").addEventListener("input",function(e){state.pmax=e.target.value?Number(e.target.value):null;render();});
$("sort").addEventListener("change",function(e){state.sort=e.target.value;render();});
$("clearf").onclick=function(){state={cats:[],flags:[],q:"",pmin:null,pmax:null,sort:"last"};document.querySelectorAll(".chip.on").forEach(function(c){c.classList.remove("on");});$("q").value="";$("pmin").value="";$("pmax").value="";$("sort").value="last";render();};
$("export").onclick=exportCSV;

function start(){loadLocal();stats();render();pullSheet();}
$("unlock").onclick=function(){if($("pin").value===ADMIN_PIN){$("gate").style.display="none";$("app").style.display="block";start();}else alert("رقم سري غير صحيح");};
$("pin").addEventListener("keydown",function(e){if(e.key==="Enter")$("unlock").click();});
start();
</script>
